<text x='306.62' y='620.97' text-anchor='middle' style='font-size: 12.00px; font-family: "Liberation Sans";' textLength='299.41px' lengthAdjust='spacingAndGlyphs'>JRC BioSAMs, value added (current US$, symlog scale)</text>
<text transform='translate(14.24,329.35) rotate(-90)' text-anchor='middle' style='font-size: 12.00px; font-family: "Liberation Sans";' textLength='394.73px' lengthAdjust='spacingAndGlyphs'>FABIO-v2 value-added extension, EXIOBASE (current US$, symlog scale)</text>
<text x='5.98' y='47.94' style='font-size: 10.00px; font-family: "Liberation Sans";' textLength='2108.44px' lengthAdjust='spacingAndGlyphs'>One point per country x year, items and components summed cell. The extension's FABIO-item value added is aggregated up to BioSAM categories. Both axes symlog: linear within ±US$1 and logarithmic beyond, so the linear core and every decade outside it are equally wide and the panels share a scale. Dashed line = identity; grey lines mark zero, so sign disagreement reads off the off-diagonal quadrants. Taxes less subsidies is the production-side measure on both sides.</text>
<text x='5.98' y='34.17' style='font-size: 14.00px; font-weight: bold; font-family: "Liberation Sans";' textLength='294.80px' lengthAdjust='spacingAndGlyphs'>EXIOBASE extension vs JRC BioSAMs at L1</text>
</g>
</g>
</svg>
